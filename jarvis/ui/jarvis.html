<!doctype html>
<html lang="pt-PT">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="jarvis-profile" content="__JARVIS_PROFILE__">
<title>JARVIS Portátil</title>
<style>
:root{color-scheme:dark;--bg:#050e18;--panel:#0b1b29;--line:#204359;--text:#e2f5ff;--muted:#a1bacb;--cyan:#79e7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 24%,#102f45,var(--bg) 63%);color:var(--text);font:15px/1.5 "Segoe UI",sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:#112a3c;color:var(--text);padding:.65rem 1rem}button:hover:not(:disabled){border-color:var(--cyan)}button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px clamp(16px,5vw,64px);border-bottom:1px solid var(--line);background:#071321}
h1{font-size:17px;letter-spacing:.25em;margin:0}h2{font-size:12px;letter-spacing:.15em;text-transform:uppercase;margin:0;color:var(--muted)}
main{max-width:1080px;margin:auto;padding:28px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,260px);gap:16px}
.hero{grid-column:1/-1;text-align:center;padding:12px 0 18px}
.reactor{width:176px;aspect-ratio:1;margin:0 auto 20px;border-radius:50%;border:1px solid #3a9bb8;position:relative;background:radial-gradient(circle,#91eaff 0%,#197591 11%,#0b2d40 27%,#19435b 28%,#081c2b 30%);box-shadow:0 0 45px #4bc9f331,inset 0 0 27px #4bc9f346}
.reactor::before,.reactor::after{content:"";position:absolute;border-radius:50%;inset:9px;border:7px dashed #6de2f9;filter:drop-shadow(0 0 6px #4bd8ff);animation:rotate 27s linear infinite}
.reactor::after{inset:29px;border:3px solid #25738e;border-top-color:var(--cyan);border-bottom-color:var(--cyan);animation:rotate 17s linear infinite reverse}
body[data-busy] .reactor::before{animation-duration:6s} @keyframes rotate{to{transform:rotate(360deg)}}
#status{color:var(--cyan);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.panel{min-width:0;border:1px solid var(--line);border-radius:12px;background:#081725df;padding:16px}
#messages{height:clamp(205px,33vh,400px);overflow:auto;margin:12px 0;display:flex;flex-direction:column;gap:10px}
.bubble{margin:0;max-width:92%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel)}
.bubble.user{align-self:flex-end;background:#10364b}.bubble.assistant{align-self:flex-start}
form{display:flex;gap:8px}#memory-form{flex-wrap:wrap;align-items:center;margin-top:8px}#memory-panel{margin-top:12px}#prompt{width:100%;min-width:0;color:var(--text);background:#050f1a;border:1px solid var(--line);border-radius:8px;padding:10px}.submit{color:#001621;background:var(--cyan);font-weight:700}
.voice-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;color:var(--muted)}
#workflow-panel{margin-top:12px}.workflow-card{border-top:1px solid var(--line);padding:10px 0}
.workflow-card form,.workflow-controls{display:flex;flex-wrap:wrap;gap:8px;margin:.6rem 0}
.workflow-card form label{display:grid;flex:1 1 100%;gap:4px}.workflow-card textarea{min-height:10rem}
.workflow-card pre{white-space:pre-wrap;overflow-wrap:anywhere}.workflow-card a{color:var(--cyan)}
#activity{padding-left:19px;color:var(--muted);overflow-wrap:anywhere}li{margin:0 0 .6em}#notice{margin:10px 0 0;color:#ffb890}#notice:empty{display:none}
@media(max-width:640px){main{grid-template-columns:1fr;padding:18px 12px}.reactor{width:126px}header{padding:12px}.panel{padding:12px}}
@media(prefers-reduced-motion:reduce){.reactor::before,.reactor::after{animation:none}}
</style>
<header><h1>JARVIS</h1><button type="button" id="holo">H.O.L.O Hands</button></header>
<main>
  <section class="hero" aria-label="Estado do assistente">
    <div class="reactor" aria-hidden="true"></div>
    <div id="status" role="status">Pronto</div>
  </section>
  <section class="panel" aria-labelledby="chat-heading">
    <h2 id="chat-heading">Conversa</h2>
    <button type="button" id="new-chat">Nova conversa</button>
    <details><summary>Histórico de conversas</summary><label>Pesquisar <input id="history-query" type="search"></label><ul id="history-results"></ul></details>
    <div id="messages" role="log" aria-label="Mensagens"></div>
    <form>
      <input id="prompt" aria-label="Mensagem" placeholder="Escreve um pedido…" maxlength="8000" required>
      <button class="submit" type="submit">Enviar</button>
    </form>
    <div class="voice-controls">
      <button type="button" id="dictate" aria-keyshortcuts="Alt+Shift+D" title="Alt+Shift+D">Ditar</button>
      <button type="button" id="stop-speech" aria-keyshortcuts="Escape" hidden>Parar leitura</button>
      <label><input type="checkbox" id="auto-read"> Ler respostas automaticamente</label>
      <label>Voz <select id="speech-voice"><option value="">Automática</option></select></label>
      <label>Velocidade <select id="speech-rate">
        <option value="0.8">Lenta</option>
        <option value="1" selected>Normal</option>
        <option value="1.2">Rápida</option>
      </select></label>
      <button type="button" id="cancel-request" hidden>Cancelar pedido</button>
      <label>Microfone <select id="microphone"><option value="">Predefinido</option></select></label>
      <button type="button" id="audio-settings">Saída de áudio do Windows</button>
      <span id="microphone-status" role="status">Microfone inativo</span>
      <span id="voice-status" role="status"></span>
    </div>
    <p id="speech-caption" role="status" hidden></p>
    <p id="transcript-preview" role="status"></p>
    <div id="reminders" role="log" aria-label="Avisos de lembretes"></div>
    <details id="download-panel" hidden>
      <summary>Avisos de downloads</summary>
      <ul id="download-watches"></ul>
    </details>
    <details id="memory-panel">
      <summary>Memórias</summary>
      <label>Memória guardada <select id="memory-record"><option value="">Nova memória</option></select></label>
      <form id="memory-form">
        <label>Nome <input name="name" maxlength="150" required></label>
        <label>Tipo <select name="kind"><option>nota</option><option>preferência</option><option>contacto</option><option>projeto</option><option>dispositivo</option><option>rotina</option></select></label>
        <label>Informação <textarea name="value" maxlength="4000" required></textarea></label>
        <button type="submit">Guardar</button>
        <button type="button" id="memory-delete">Apagar</button>
        <button type="button" id="memory-export">Exportar</button>
      </form>
      <p id="memory-feedback" role="status"></p>
    </details>
    <details id="routine-panel">
      <summary>Rotina de programação</summary>
      <ol id="routine-preview" aria-label="Passos previstos"></ol>
      <button type="button" data-routine="Ativa o modo programação">Executar agora</button>
      <button type="button" data-routine="Amanhã às nove, ativa o modo programação">Agendar para amanhã às 09:00</button>
      <form id="routine-editor">
        <label>Data e hora <input type="datetime-local" name="when" required></label>
        <button type="submit">Agendar</button>
      </form>
      <ul id="routine-history"></ul>
    </details>
    <details id="workflow-panel">
      <summary>Tarefas em vários passos</summary>
      <p id="workflow-feedback" role="status"></p>
      <div id="workflow-list"></div>
    </details>
    <p id="notice" role="alert"></p>
  </section>
  <aside class="panel" aria-labelledby="activity-heading">
    <h2 id="activity-heading">Atividade do Hermes</h2>
    <div role="log" aria-label="Atividade das ferramentas"><ul id="activity"><li>À espera de um pedido.</li></ul></div>
  </aside>
</main>
<script>
const form = document.querySelector('form');
const input = document.querySelector('#prompt');
const send = form.querySelector('.submit');
const messages = document.querySelector('#messages');
const activity = document.querySelector('#activity');
const status = document.querySelector('#status');
const notice = document.querySelector('#notice');
const holo = document.querySelector('#holo');
const historyKey = 'jarvis-conversations-' + document.querySelector('meta[name="jarvis-profile"]').content;
let sessions = [];
try { sessions = JSON.parse(localStorage.getItem(historyKey)) || []; } catch {}
let sessionId = sessions.at(-1)?.id;
let history = sessions.at(-1)?.messages || [];

function showHistory() {
  messages.replaceChildren();
  for (const entry of history) bubble(entry.role, entry.content);
}

function renderHistorySearch() {
  const query = document.querySelector('#history-query').value.toLocaleLowerCase('pt-PT');
  const results = document.querySelector('#history-results');
  results.replaceChildren();
  for (const session of [...sessions].reverse()) {
    if (!session.messages.some(item => item.content.toLocaleLowerCase('pt-PT').includes(query))) continue;
    const row = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = session.messages[0].content.slice(0, 100);
    button.onclick = () => {
      if (requestController || recognition) return;
      sessionId = session.id;
      history = session.messages;
      showHistory();
    };
    row.append(button);
    results.append(row);
  }
}

function saveConversation() {
  sessionId ??= crypto.randomUUID();
  sessions = sessions.filter(session => session.id !== sessionId);
  sessions.push({id:sessionId, messages:history});
  try { localStorage.setItem(historyKey, JSON.stringify(sessions)); }
  catch { notice.textContent = 'O navegador não conseguiu guardar o histórico.'; }
  renderHistorySearch();
}
const headers = {'Content-Type': 'application/json'};

const dictate = document.querySelector('#dictate');
const stopSpeech = document.querySelector('#stop-speech');
const voiceStatus = document.querySelector('#voice-status');
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const microphone = document.querySelector('#microphone');
const microphoneStatus = document.querySelector('#microphone-status');
const speechCaption = document.querySelector('#speech-caption');
const cancelRequest = document.querySelector('#cancel-request');
let recognition;
let requestController;
let capture;
let pendingReminder;

cancelRequest.addEventListener('click', () => requestController?.abort());

async function refreshMicrophones() {
  const devices = await navigator.mediaDevices?.enumerateDevices();
  if (!devices) return;
  const selected = microphone.value;
  microphone.replaceChildren(new Option('Predefinido', ''));
  for (const device of devices) {
    if (device.kind === 'audioinput' && device.deviceId && device.deviceId !== 'default') {
      microphone.add(new Option(device.label || 'Microfone ' + microphone.options.length, device.deviceId));
    }
  }
  if ([...microphone.options].some(option => option.value === selected)) microphone.value = selected;
}
refreshMicrophones().catch(() => {});
navigator.mediaDevices?.addEventListener('devicechange', () => refreshMicrophones().catch(() => {}));

document.querySelector('#audio-settings').addEventListener('click', async () => {
  try {
    const response = await fetch('/audio-settings', {method:'POST', headers, body:'{}'});
    if (!response.ok) throw new Error();
    voiceStatus.textContent = 'Escolhe a saída em Sistema > Som no Windows.';
  } catch {
    voiceStatus.textContent = 'Abre as definições de som do Windows para escolher a saída.';
  }
});

function scheduleReminder({label, due}) {
  const entry = {label};
  entry.timer = window.setTimeout(() => {
    if (pendingReminder === entry) pendingReminder = undefined;
    const reminder = document.createElement('p');
    reminder.textContent = 'Lembrete: ' + label;
    document.querySelector('#reminders').append(reminder);
    if (autoRead.checked && !recognition) queueSpeech(reminder.textContent);
  }, Math.max(0, due * 1000 - Date.now()));
  pendingReminder = entry;
}
const autoRead = document.querySelector('#auto-read');
const speechVoice = document.querySelector('#speech-voice');
const speechRate = document.querySelector('#speech-rate');
const synthesis = window.speechSynthesis;
let speaking = new Set();
let streamedSpeech;

function interruptSpeech() {
  streamedSpeech = undefined;
  if (!speaking.size) return;
  speaking.clear();
  speechCaption.hidden = true;
  window.speechSynthesis.cancel();
  stopSpeech.hidden = true;
  voiceStatus.textContent = 'Leitura interrompida.';
}

stopSpeech.addEventListener('click', interruptSpeech);
autoRead.addEventListener('change', () => {
  if (!autoRead.checked) interruptSpeech();
});
autoRead.disabled = !synthesis;
speechRate.disabled = !synthesis;
speechVoice.disabled = !synthesis;

function localPortugueseVoices() {
  return synthesis.getVoices().filter(
    voice => voice.localService && /^pt(?:[-_]|$)/i.test(voice.lang)
  );
}

let preferredVoice = "";
function refreshVoiceOptions() {
  const selected = preferredVoice || speechVoice.value;
  const voices = localPortugueseVoices();
  speechVoice.replaceChildren(new Option('Automática', ''));
  for (const voice of voices) {
    speechVoice.add(new Option(voice.name + ' (' + voice.lang + ')', voice.voiceURI));
  }
  if (voices.some(voice => voice.voiceURI === selected)) speechVoice.value = selected;
}

if (synthesis) {
  refreshVoiceOptions();
  synthesis.addEventListener('voiceschanged', refreshVoiceOptions);
}

function queueSpeech(text) {
  const voices = localPortugueseVoices();
  const voice = voices.find(voice => voice.voiceURI === speechVoice.value)
    || voices.find(voice => /^pt[-_]pt$/i.test(voice.lang))
    || voices[0];
  if (!voice) {
    voiceStatus.textContent = 'Ativa uma voz portuguesa no Windows para ouvir a resposta.';
    return;
  }
  const speech = new SpeechSynthesisUtterance(text);
  speech.voice = voice;
  speech.lang = voice.lang;
  speech.rate = Number(speechRate.value);
  speaking.add(speech);
  stopSpeech.hidden = false;
  voiceStatus.textContent = 'A ler a resposta…';
  function finish(message) {
    if (!speaking.delete(speech)) return;
    speechCaption.hidden = true;
    if (speaking.size) return;
    stopSpeech.hidden = true;
    voiceStatus.textContent = message;
  }
  speech.onstart = () => {
    if (!speaking.has(speech)) return;
    speechCaption.textContent = text;
    speechCaption.hidden = false;
  };
  speech.onend = () => finish('Leitura concluída.');
  speech.onerror = () => finish('Não foi possível reproduzir o áudio.');
  window.speechSynthesis.speak(speech);
}

function readAloud(text) {
  interruptSpeech();
  queueSpeech(text);
}

function readStreamedText(session, text, complete = false) {
  if (!session || session !== streamedSpeech || recognition) return;
  session.pending += text;
  const parts = session.pending.split(/(?<=[.!?…])\s+/);
  session.pending = parts.pop();
  if (complete) {
    parts.push(session.pending);
    streamedSpeech = undefined;
  }
  for (const part of parts) {
    if (part.trim()) queueSpeech(part.trim());
  }
}

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    interruptSpeech();
    recognition?.stop();
    requestController?.abort();
    return;
  }
  if (event.code !== 'KeyD' || !event.altKey || !event.shiftKey || event.ctrlKey ||
      event.metaKey || event.repeat || event.isComposing || dictate.disabled) return;
  event.preventDefault();
  dictate.click();
});

async function recordLocalVoice() {
  interruptSpeech();
  dictate.disabled = true;
  send.disabled = true;
  const originalDraft = input.value;
  let timer;
  function finish() {
    clearTimeout(timer);
    capture?.getTracks().forEach(track => track.stop());
    capture = undefined;
    recognition = undefined;
    dictate.disabled = false;
    dictate.textContent = 'Ditar';
    microphoneStatus.textContent = 'Microfone inativo';
    send.disabled = Boolean(requestController);
    input.focus();
  }
  try {
    capture = await navigator.mediaDevices.getUserMedia({audio: microphone.value
      ? {deviceId:{exact:microphone.value}} : true});
    const recorder = new MediaRecorder(capture);
    const chunks = [];
    recognition = {stop: () => recorder.state !== 'inactive' && recorder.stop()};
    recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
    recorder.onerror = () => { voiceStatus.textContent = 'Falha na gravação. Tenta novamente.'; finish(); };
    recorder.onstop = async () => {
      clearTimeout(timer);
      capture?.getTracks().forEach(track => track.stop());
      dictate.disabled = true;
      microphoneStatus.textContent = 'Microfone inativo';
      voiceStatus.textContent = 'A transcrever no computador…';
      try {
        const bytes = new Uint8Array(await new Blob(chunks).arrayBuffer());
        let binary = '';
        for (const byte of bytes) binary += String.fromCharCode(byte);
        const response = await fetch('/transcribe', {method:'POST', headers,
          signal:AbortSignal.timeout(90000),
          body: JSON.stringify({audio:btoa(binary)})});
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);
        if (!result.text) throw new Error('Não reconheci voz. Tenta falar mais perto do microfone.');
        if (requestController && /^cancela[.!?]?$/i.test(result.text.trim())) {
          requestController.abort();
          input.value = originalDraft;
          voiceStatus.textContent = 'Pedido cancelado por voz.';
        } else {
          input.value = result.text;
          document.querySelector('#transcript-preview').textContent = result.text;
          voiceStatus.textContent = 'Revê a transcrição e prime Enviar.';
        }
      } catch (error) {
        input.value = originalDraft;
        voiceStatus.textContent = error.message || 'Não consegui transcrever.';
      } finally { finish(); }
    };
    recorder.start();
    dictate.disabled = false;
    dictate.textContent = 'Parar ditado';
    microphoneStatus.textContent = 'Microfone ativo';
    voiceStatus.textContent = 'A gravar localmente. Prime Parar ditado quando terminares (máximo 60 segundos).';
    timer = setTimeout(() => recognition?.stop(), 60000);
    refreshMicrophones().catch(() => {});
  } catch {
    voiceStatus.textContent = 'Permite o acesso ao microfone e confirma o dispositivo selecionado.';
    finish();
  }
}

dictate.addEventListener('click', async () => {
  if (recognition) {
    dictate.disabled = true;
    recognition.stop();
    return;
  }
  if (typeof Recognition?.available !== 'function' || !('processLocally' in Recognition.prototype)) {
    return recordLocalVoice();
  }
  interruptSpeech();
  dictate.disabled = true;
  send.disabled = true;
  voiceStatus.textContent = 'A verificar o ditado local…';
  function finish(micStatus = "Microfone inativo") {
    microphoneStatus.textContent = micStatus;
    capture?.getTracks().forEach(track => track.stop());
    capture = undefined;
    recognition = undefined;
    dictate.textContent = 'Ditar';
    dictate.disabled = false;
    send.disabled = Boolean(requestController);
    input.focus();
  }
  try {
    const options = {langs: ['pt-PT'], processLocally: true};
    const availability = await Recognition.available(options);
    if (availability !== 'available') {
      const canInstall = ['downloadable', 'downloading'].includes(availability)
        && typeof Recognition.install === 'function';
      if (!canInstall || !await Recognition.install(options)) {
        finish();
        return recordLocalVoice();
      }
    }
    const session = new Recognition();
    recognition = session;
    session.lang = 'pt-PT';
    session.processLocally = true;
    session.interimResults = true;
    const originalDraft = input.value;
    let final = false;
    session.onstart = () => {
      dictate.disabled = false;
      dictate.textContent = 'Parar ditado';
      microphoneStatus.textContent = 'Microfone ativo';
      voiceStatus.textContent = 'A ouvir…';
    };
    session.onresult = event => {
      if (recognition !== session) return;
      const result = event.results[0];
      input.value = result[0].transcript.trim().slice(0, input.maxLength);
      document.querySelector('#transcript-preview').textContent = input.value;
      final = result.isFinal;
      if (final && requestController && /^cancela[.!?]?$/i.test(input.value)) {
        input.value = originalDraft;
        requestController.abort();
        finish();
        session.abort();
        return;
      }
      if (final) voiceStatus.textContent = 'Revê a transcrição antes de enviar.';
    };
    session.onerror = event => {
      if (recognition !== session) return;
      input.value = originalDraft;
      voiceStatus.textContent = event.error === 'not-allowed'
        ? 'Permite o acesso ao microfone para ditar.'
        : 'Não foi possível transcrever. Podes escrever o pedido.';
      finish('Microfone indisponível');
    };
    session.onend = () => {
      if (recognition !== session) return;
      if (!final) {
        input.value = originalDraft;
        voiceStatus.textContent = 'Nenhum pedido foi reconhecido.';
      }
      finish();
    };
    if (microphone.value) {
      capture = await navigator.mediaDevices.getUserMedia({audio:{deviceId:{exact:microphone.value}}});
      session.start(capture.getAudioTracks()[0]);
    } else {
      session.start();
    }
    refreshMicrophones().catch(() => {});
  } catch {
    voiceStatus.textContent = 'Não foi possível iniciar o ditado. Verifica a permissão e o microfone selecionado.';
    finish('Microfone indisponível');
  }
});

function bubble(role, content) {
  const item = document.createElement('p');
  item.className = 'bubble ' + role;
  item.textContent = content;
  messages.append(item);
  messages.scrollTop = messages.scrollHeight;
  return item;
}

function toolUpdate(data, rows) {
  let row = rows.get(data.toolCallId);
  if (!row) {
    if (!rows.size) activity.replaceChildren();
    row = document.createElement('li');
    rows.set(data.toolCallId, row);
    activity.append(row);
  }
  const label = data.tool === 'mcp__jarvis_files__listar_ficheiros' ? 'Listar ficheiros' : data.tool;
  row.textContent = label + (data.status === 'running' ? ' · em execução' : ' · concluída');
}

async function readReply(response, answer, speech) {
  const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
  const rows = new Map();
  let pending = '';
  let complete = false;
  let text = '';
  try {
    while (!complete) {
      const chunk = await reader.read();
      if (chunk.done) break;
      pending += chunk.value;
      const frames = pending.split(/\r?\n\r?\n/);
      pending = frames.pop();
      for (const frame of frames) {
        const lines = frame.split(/\r?\n/);
        const raw = lines.filter(line => line.startsWith('data:')).map(line => line.slice(5).trimStart()).join('\n');
        if (!raw) continue;
        if (raw === '[DONE]') {
          complete = true;
          break;
        }
        const data = JSON.parse(raw);
        if (data.error) throw new Error('O Hermes devolveu um erro durante o pedido.');
        if (lines.includes('event: hermes.tool.progress')) {
          toolUpdate(data, rows);
        } else if (data.choices?.[0]?.delta?.content) {
          const delta = data.choices[0].delta.content;
          text += delta;
          readStreamedText(speech, delta);
          answer.textContent = text.trimStart();
          messages.scrollTop = messages.scrollHeight;
        }
      }
    }
    if (!text.trim() || !complete) throw new Error('A resposta do Hermes ficou incompleta.');
    if (!rows.size) activity.firstElementChild.textContent = 'Nenhuma chamada de ferramenta recebida.';
    readStreamedText(speech, "", true);
    return text;
  } finally {
    await reader.cancel().catch(() => {});
  }
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  const content = input.value.trim();
  if (!content || send.disabled) return;
  interruptSpeech();
  send.disabled = true;
  notice.textContent = '';
  input.value = '';
  status.textContent = 'A processar';
  document.body.dataset.busy = '';
  activity.replaceChildren(document.createElement('li'));
  activity.firstElementChild.textContent = 'Pedido enviado ao Hermes.';
  const user = {role: 'user', content};
  bubble(user.role, content);
  const speech = autoRead.checked ? {pending: ""} : undefined;
  streamedSpeech = speech;
  const answer = bubble('assistant', 'A aguardar resposta…');
  const correction = /^afinal,?\s+(daqui a .+?)[.!?]?$/i.exec(content);
  const previous = correction ? pendingReminder : undefined;
  const controller = new AbortController();
  requestController = controller;
  cancelRequest.hidden = false;
  try {
    if (/^(?:jarvis,? )?cancela (?:o )?(?:último )?lembrete[.!?]?$/i.test(content)) {
      const entry = pendingReminder;
      if (entry) {
        window.clearTimeout(entry.timer);
        pendingReminder = undefined;
      }
      answer.textContent = entry ? 'Lembrete cancelado.' : 'Não há um lembrete pendente para cancelar.';
      history.push(user, {role:'assistant', content:answer.textContent});
      saveConversation();
      activity.firstElementChild.textContent = 'Pedido processado localmente';
      status.textContent = 'Pronto';
      streamedSpeech = undefined;
      return;
    }
    if (correction && !previous) throw new Error('Não há um lembrete pendente para corrigir.');
    const outgoing = previous ? {...user, content: 'Lembra-me ' + correction[1] + ' de ' + previous.label} : user;
    sessionId ??= crypto.randomUUID();
    const response = await fetch('/chat', {
      signal: controller.signal,
      method: 'POST', headers,
      body: JSON.stringify({session_id:sessionId, messages: [...history.slice(-18), outgoing]}),
    });
    if (!response.ok) throw new Error((await response.json()).error);
    const local = response.headers.get('Content-Type')?.startsWith('application/json');
    const result = local ? await response.json() : null;
    const reply = local ? result.reply : await readReply(response, answer, speech);
    if (result?.workflow) workflowPanel.open = true;
    if (result?.reminder) {
      if (previous && pendingReminder !== previous) throw new Error('O lembrete anterior já disparou.');
      if (previous) window.clearTimeout(previous.timer);
      scheduleReminder(result.reminder);
    }
    if (local) {
      answer.textContent = reply;
      for (const source of result.links || []) {
        const link = document.createElement('a');
        link.href = source.url;
        link.textContent = source.label;
        link.target = '_blank';
        link.rel = 'noopener';
        answer.append(document.createElement('br'), link);
      }
      activity.firstElementChild.textContent = 'Pedido processado localmente';
      readStreamedText(speech, reply, true);
    }
    history.push(user, {role: 'assistant', content: reply.slice(0, 8000)});
    saveConversation();
    if (document.querySelector('#routine-panel').open) memoryAction('list');
    status.textContent = 'Pronto';
    if ('speechSynthesis' in window) {
      const listen = document.createElement('button');
      listen.type = 'button';
      listen.textContent = 'Ouvir resposta';
      listen.addEventListener('click', () => {
        if (!recognition) readAloud(reply);
      });
      answer.after(listen);
      messages.scrollTop = messages.scrollHeight;
    }
  } catch (error) {
    if (speech && speech === streamedSpeech) interruptSpeech();
    if (answer.textContent === 'A aguardar resposta…') answer.remove();
    notice.textContent = controller.signal.aborted ? 'Pedido cancelado.' : (error.message || 'Não foi possível completar o pedido.');
    status.textContent = 'Pedido interrompido';
  } finally {
    delete document.body.dataset.busy;
    requestController = undefined;
    cancelRequest.hidden = true;
    send.disabled = Boolean(recognition) || dictate.disabled;
    input.focus();
  }
});

holo.addEventListener('click', async () => {
  holo.disabled = true;
  notice.textContent = '';
  try {
    const response = await fetch('/holo', {method: 'POST', headers, body: '{}'});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error);
    window.location.assign(data.url);
  } catch (error) {
    notice.textContent = error.message;
  } finally {
    holo.disabled = false;
  }
});
const memoryPanel = document.querySelector('#memory-panel');
const memoryForm = document.querySelector('#memory-form');
const memorySelect = document.querySelector('#memory-record');
const memoryFeedback = document.querySelector('#memory-feedback');
let records = [];

function describeRoutineResult(result) {
  if (result.erro) return result.erro;
  if (result.resposta) return result.rotina + ' · ' + result.resposta;
  return ['Pedido ao VS Code: ' + result.projeto, ...(result.notas || [])].join(' · ');
}

async function memoryAction(action) {
  const data = Object.fromEntries(new FormData(memoryForm));
  try {
    const response = await fetch('/memory', {
      method: 'POST', headers, body: JSON.stringify({...data, action}),
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    records = result.records;
    const preview = document.querySelector('#routine-preview');
    preview.replaceChildren();
    for (const step of result.routine_preview || []) {
      const row = document.createElement('li');
      row.textContent = step;
      preview.append(row);
    }
    const routineHistory = document.querySelector('#routine-history');
    routineHistory.replaceChildren();
    for (const routine of result.routines) {
      const row = document.createElement('li');
      row.textContent = new Date((routine.finished || routine.due) * 1000).toLocaleString('pt-PT') + ' · ' + routine.status +
        (routine.result ? ' · ' + describeRoutineResult(JSON.parse(routine.result)) : '');
      routineHistory.append(row);
    }
    memorySelect.replaceChildren(new Option('Nova memória', ''));
    for (const record of records) {
      memorySelect.add(new Option(record.name, record.name));
    }
    memoryFeedback.textContent = action === 'save' ? 'Memória guardada.' :
      action === 'delete' ? 'Memória apagada.' : '';
    return result;
  } catch (error) {
    memoryFeedback.textContent = error.message;
    return null;
  }
}

memoryPanel.addEventListener('toggle', () => {
  if (memoryPanel.open) memoryAction('list');
});
memorySelect.addEventListener('change', () => {
  const record = records.find(item => item.name === memorySelect.value);
  memoryForm.reset();
  if (!record) return;
  for (const field of ['name', 'kind', 'value']) memoryForm.elements[field].value = record[field];
  memoryFeedback.textContent = 'Origem: ' + record.source + ' · ' + new Date(record.updated).toLocaleString('pt-PT');
});
memoryForm.addEventListener('submit', event => {
  event.preventDefault();
  memoryAction('save');
});
document.querySelector('#memory-delete').addEventListener('click', () => {
  if (!memorySelect.value) return;
  memoryForm.elements.name.value = memorySelect.value;
  memoryAction('delete').then(result => { if (result) memoryForm.reset(); });
});
document.querySelector('#memory-export').addEventListener('click', async () => {
  const result = await memoryAction('list');
  if (!result) return;
  const url = URL.createObjectURL(new Blob([JSON.stringify(result.records, null, 2)], {type:'application/json'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'jarvis-memorias.json';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
document.querySelector('#history-query').addEventListener('input', renderHistorySearch);
document.querySelector('#new-chat').addEventListener('click', () => {
  if (requestController || recognition) return;
  sessionId = undefined;
  history = [];
  showHistory();
});
showHistory();
renderHistorySearch();
const routinePanel = document.querySelector('#routine-panel');
document.querySelector('#routine-editor').addEventListener('submit', event => {
  event.preventDefault();
  if (send.disabled) return;
  input.value = 'Agenda o modo programação para ' + event.currentTarget.elements.when.value.replace('T', ' ');
  form.requestSubmit();
});
routinePanel.addEventListener('toggle', () => { if (routinePanel.open) memoryAction('list'); });
for (const button of routinePanel.querySelectorAll('[data-routine]')) {
  button.addEventListener('click', () => {
    if (send.disabled) return;
    input.value = button.dataset.routine;
    form.requestSubmit();
  });
}
async function checkAgendaAlerts() {
  try {
    const response = await fetch('/agenda-alerts', {method:'POST', headers});
    if (!response.ok) return;
    const {alerts} = await response.json();
    for (const alert of alerts) {
      const message = document.createElement('p');
      message.textContent = 'Agenda: ' + alert.title;
      document.querySelector('#reminders').append(message);
    }
  } catch {}
}
setInterval(checkAgendaAlerts, 10000);

const downloadPanel = document.querySelector('#download-panel');
const downloadList = document.querySelector('#download-watches');
let lastDownloadList;

async function refreshDownloads() {
  try {
    const response = await fetch('/download-watches', {method:'POST', headers});
    if (!response.ok) return;
    const {watches, alerts} = await response.json();
    const snapshot = JSON.stringify(watches);
    if (snapshot !== lastDownloadList) {
      lastDownloadList = snapshot;
      downloadPanel.hidden = !watches.length;
      downloadList.replaceChildren(...watches.map(watch => {
        const item = document.createElement('li');
        item.textContent = 'Aviso ' + watch.id + ' · ' + watch.name + ' · ' + watch.status;
        return item;
      }));
    }
    for (const alert of alerts) {
      const item = document.createElement('p');
      item.textContent = 'Download concluído: ' + alert.name;
      document.querySelector('#reminders').append(item);
    }
  } catch {}
}

refreshDownloads();
setInterval(refreshDownloads, 5000);
const workflowPanel = document.querySelector('#workflow-panel');
const workflowList = document.querySelector('#workflow-list');
const workflowFeedback = document.querySelector('#workflow-feedback');
const workflowCards = new Map();
let workflowPending;

async function refreshWorkflows(action = 'list', task, fields = {}) {
  if (workflowPending && action === 'list') return;
  while (workflowPending) await workflowPending;
  const request = fetch('/workflows', {
    method:'POST', headers,
    body: JSON.stringify({action, id:task?.id, revision:task?.revision, ...fields}),
  });
  let releaseWorkflow;
  workflowPending = new Promise(resolve => {
    releaseWorkflow = resolve;
  });
  try {
    const response = await request;
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    renderWorkflows(result.tasks);
    if (action !== 'list') workflowFeedback.textContent = action === 'draft' ? 'Rascunho guardado. Revê os dados e as versões dos anexos antes de descarregar.' : '';
  } catch (error) {
    workflowFeedback.textContent = error.message || 'As tarefas estão indisponíveis.';
  } finally {
    workflowPending = undefined;
    releaseWorkflow();
  }
}

function renderWorkflows(tasks) {
  const activeIds = new Set(tasks.map(task => task.id));
  for (const [id, node] of workflowCards) {
    if (!activeIds.has(id)) {
      node.remove();
      workflowCards.delete(id);
    }
  }
  if (!tasks.length) {
    workflowList.textContent = 'Ainda não há tarefas.';
    return;
  }
  if (!workflowCards.size) workflowList.replaceChildren();
  for (const task of tasks) {
    const previous = workflowCards.get(task.id);
    if (previous?.dataset.revision === String(task.revision)) continue;
    const card = taskCard(task);
    if (previous) previous.replaceWith(card);
    else {
      const next = [...workflowList.children].find(node => Number(node.dataset.id) < task.id);
      workflowList.insertBefore(card, next || null);
    }
    workflowCards.set(task.id, card);
  }
}

function taskButton(label, callback, type = 'button') {
  const button = document.createElement('button');
  button.type = type;
  button.textContent = label;
  if (callback) button.addEventListener('click', callback);
  return button;
}

function taskCard(task) {
  const card = document.createElement('section');
  card.className = 'workflow-card';
  card.dataset.id = task.id;
  card.dataset.revision = task.revision;
  const title = document.createElement('h3');
  title.textContent = 'Comparar PDFs e preparar email';
  const progress = document.createElement('ol');
  task.steps.forEach((step, index) => {
    const row = document.createElement('li');
    const state = index < task.step ? 'concluído' : index === task.step ? task.status : 'planeado';
    row.textContent = step + ' · ' + state;
    if (index === task.step) row.setAttribute('aria-current', 'step');
    progress.append(row);
  });
  card.append(title, progress);

  const {data, status:taskStatus} = task;
  if (data.error) {
    const error = document.createElement('p');
    error.textContent = data.error;
    card.append(error);
  }
  if (task.step === 0 && taskStatus === 'a rever') {
    const selector = document.createElement('form');
    const options = document.createElement('datalist');
    options.id = 'pdf-versions-' + task.id;
    for (const name of data.candidates) {
      const option = document.createElement('option');
      option.value = name;
      options.append(option);
    }
    selector.append(options);
    taskField(selector, 'old', 'PDF anterior no projeto', data.old || '', 500, options.id);
    taskField(selector, 'new', 'PDF atual no projeto', data.new || '', 500, options.id);
    selector.append(taskButton('Confirmar ficheiros', null, 'submit'));
    selector.addEventListener('submit', event => {
      event.preventDefault();
      refreshWorkflows('select', task, Object.fromEntries(new FormData(selector)));
    });
    card.append(selector);
  }
  if (data.comparison) {
    const comparison = document.createElement('details');
    const heading = document.createElement('summary');
    heading.textContent = 'Ver comparação';
    const report = document.createElement('pre');
    report.textContent = data.comparison;
    comparison.append(heading, report);
    for (const source of task.links) {
      const link = document.createElement('a');
      link.href = source.url;
      link.textContent = source.label;
      link.target = '_blank';
      link.rel = 'noopener';
      comparison.append(link, document.createElement('br'));
    }
    card.append(comparison);
  }
  if (data.draft) card.append(draftForm(task));
  const controls = document.createElement('div');
  controls.className = 'workflow-controls';
  if (taskStatus === 'falhou') {
    controls.append(taskButton('Repetir este passo', () => refreshWorkflows('retry', task)));
  }
  if (task.step === 1 && ['falhou', 'na fila'].includes(taskStatus)) {
    controls.append(taskButton('Corrigir ficheiros', () => refreshWorkflows('files', task)));
  }
  if (['a rever', 'na fila', 'em execução', 'falhou'].includes(taskStatus)) {
    controls.append(taskButton('Cancelar tarefa', () => refreshWorkflows('cancel', task)));
  }
  card.append(controls);
  return card;
}

function draftForm(task) {
  const draft = document.createElement('form');
  const {data} = task;
  const attachments = data.attachments || [];
  taskField(draft, 'recipient', 'Destinatários (separados por vírgulas)', data.draft.recipient, 320);
  taskField(draft, 'subject', 'Assunto', data.draft.subject, 300);
  taskField(draft, 'body', 'Rascunho', data.draft.body, 30000);
  const paths = taskField(draft, 'attachments', 'Anexos do projeto (um caminho por linha)',
    attachments.map(attachment => attachment.path).join('\n'), 2504);

  if (attachments.length) {
    const versions = document.createElement('ul');
    versions.setAttribute('aria-label', 'Versões guardadas dos anexos');
    for (const attachment of attachments) {
      const row = document.createElement('li');
      const version = document.createElement('code');
      version.textContent = attachment.sha256.slice(0, 12);
      version.title = attachment.sha256;
      row.textContent = attachment.name + ' · ' + attachment.size.toLocaleString('pt-PT') + ' bytes · SHA-256 ';
      row.append(version);
      versions.append(row);
    }
    draft.append(versions);
  }

  const exportButton = taskButton('Descarregar email (.eml)', () => exportDraft(task));
  if (data.old && data.new) {
    draft.append(taskButton('Anexar os PDFs comparados', () => {
      const current = paths.value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
      paths.value = [...new Set([...current, data.old, data.new])].join('\n');
      exportButton.disabled = true;
      paths.focus();
    }));
  }
  draft.append(
    taskButton('Guardar e rever', null, 'submit'),
    exportButton,
    taskButton('Descarregar texto', () => {
      const values = Object.fromEntries(new FormData(draft));
      saveDraftFile(new Blob(
        ['Para: ', values.recipient, '\nAssunto: ', values.subject, '\n\n', values.body],
        {type:'text/plain;charset=utf-8'},
      ), task.id, 'txt');
    }),
  );
  draft.addEventListener('input', () => { exportButton.disabled = true; });
  draft.addEventListener('submit', event => {
    event.preventDefault();
    const fields = Object.fromEntries(new FormData(draft));
    fields.attachments = paths.value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
    refreshWorkflows('draft', task, fields);
  });
  return draft;
}

async function exportDraft(task) {
  try {
    const response = await fetch('/workflows', {
      method:'POST', headers,
      body:JSON.stringify({action:'export', id:task.id, revision:task.revision}),
    });
    if (!response.ok) throw new Error((await response.json()).error);
    saveDraftFile(await response.blob(), task.id, 'eml');
    workflowFeedback.textContent = '';
  } catch (error) {
    workflowFeedback.textContent = error.message || 'Não consegui descarregar o rascunho.';
  }
}

function saveDraftFile(content, identifier, extension) {
  const url = URL.createObjectURL(content);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'jarvis-rascunho-' + identifier + '.' + extension;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function taskField(container, name, caption, value, limit, suggestions) {
  const label = document.createElement('label');
  label.textContent = caption;
  const field = document.createElement(['body', 'attachments'].includes(name) ? 'textarea' : 'input');
  field.name = name;
  field.value = value;
  field.maxLength = limit;
  field.required = !['recipient', 'attachments'].includes(name);
  if (suggestions) field.setAttribute('list', suggestions);
  label.append(field);
  container.append(label);
  return field;
}

workflowPanel.addEventListener('toggle', () => { if (workflowPanel.open) refreshWorkflows(); });
setInterval(() => { if (workflowPanel.open) refreshWorkflows(); }, 1500);

async function loadVoiceSettings() {
  try {
    const response = await fetch('/memory', {method:'POST', headers, body:JSON.stringify({action:'list'})});
    if (!response.ok) return;
    const {voice_settings: settings} = await response.json();
    if (!settings || voiceSettingsChanged) return;
    preferredVoice = settings.voice;
    speechRate.value = settings.speed;
    autoRead.checked = settings.automatic && Boolean(synthesis);
    if (synthesis) refreshVoiceOptions();
  } catch {}
}
let voiceSettingsChanged = false;
let saveVoiceSettings = Promise.resolve();
for (const control of [speechVoice, speechRate, autoRead]) {
  control.addEventListener('change', () => {
    voiceSettingsChanged = true;
    if (control === speechVoice) preferredVoice = speechVoice.value;
    const body = JSON.stringify({action:'settings', voice:preferredVoice || speechVoice.value,
      speed:speechRate.value, automatic:autoRead.checked});
    saveVoiceSettings = saveVoiceSettings.then(async () => {
      const response = await fetch('/memory', {method:'POST', headers, body});
      if (!response.ok) throw new Error();
    }).catch(() => { voiceStatus.textContent = 'Não consegui guardar as definições de voz.'; });
  });
}
loadVoiceSettings();
